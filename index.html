<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EEG Sleep Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #10002b, #3c096c, #9d4edd);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 25px rgba(255, 0, 127, 0.4);
            border: 1px solid #ff007f;
        }
        .metrics {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .metric-box {
            background: rgba(255, 0, 127, 0.1);
            border-left: 5px solid #ff007f;
            padding: 20px;
            width: 30%;
            border-radius: 5px;
        }
        .metric-box h3 { margin: 0 0 10px 0; color: #e0aaff; }
        .metric-box h1 { margin: 0; font-size: 2.5em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="metrics">
            <div class="metric-box">
                <h3>Calculated Score</h3>
                <h1 id="sleepScore">--</h1>
            </div>
            <div class="metric-box">
                <h3>Total Tracked Time</h3>
                <h1 id="totalTime">--</h1>
            </div>
            <div class="metric-box">
                <h3>Current Status</h3>
                <h1 id="currentStatus">Active</h1>
            </div>
        </div>
        <canvas id="sleepChart" height="100"></canvas>
    </div>

    <script>
        // Map string states to numerical values for Cartesian plotting
        const stateMapping = { "Deep Sleep": 1, "Light Sleep / REM": 2, "Relaxed Awake": 3, "Awake": 4 };
        
        async function fetchAndRender() {
            const response = await fetch('/api/data');
            const data = await response.json();
            
            if(data.timestamps.length === 0) return;

            let deepCount = 0, lightCount = 0, wakeCount = 0;
            const numericStates = data.states.map((state, index) => {
                if(state.includes("Deep")) deepCount++;
                else if(state.includes("Light")) lightCount++;
                else if(state.includes("Awake")) {
                    // Count unique wake interruptions (ignoring continuous wake logs)
                    if(index === 0 || !data.states[index-1].includes("Awake")) wakeCount++;
                }
                return stateMapping[state] || 0;
            });

            // Hardware timestamp calculations
            const totalMinutes = data.timestamps.length; // Assuming 1 log per minute roughly
            document.getElementById('totalTime').innerText = `${Math.floor(totalMinutes / 60)}h ${totalMinutes % 60}m`;
            
            // Execute statistical derivation formula
            let score = 0;
            if (totalMinutes > 0) {
                let rawScore = (((1.5 * deepCount) + (1.0 * lightCount)) / totalMinutes) * 100 - (5 * wakeCount);
                score = Math.max(0, Math.min(100, Math.round(rawScore)));
            }
            document.getElementById('sleepScore').innerText = score;

            // Render detailed coordinate graph
            const ctx = document.getElementById('sleepChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: data.timestamps.map(t => t.split(' ')[1]),
                    datasets: [{
                        label: 'Neurological State',
                        data: numericStates,
                        borderColor: '#ff007f',
                        backgroundColor: 'rgba(255, 0, 127, 0.2)',
                        borderWidth: 3,
                        stepped: true,
                        fill: true,
                        pointRadius: 0
                    }]
                },
                options: {
                    responsive: true,
                    scales: {
                        y: {
                            ticks: {
                                callback: function(value) {
                                    return Object.keys(stateMapping).find(key => stateMapping[key] === value);
                                },
                                color: '#e0aaff'
                            },
                            min: 0.5,
                            max: 4.5
                        },
                        x: { ticks: { color: '#e0aaff', maxTicksLimit: 20 } }
                    },
                    plugins: {
                        legend: { labels: { color: '#ffffff' } }
                    }
                }
            });
        }
        
        fetchAndRender();
        // Automatically refresh network requests every 60 seconds
        setInterval(fetchAndRender, 60000); 
    </script>
</body>
</html>
