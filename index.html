<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EEG Sleep Analytics</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
    <style>
        body {
            background-color: rgb(36, 178, 180);
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            margin: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border: 2px solid #ffffff;
        }
        .controls {
            margin-bottom: 20px;
            text-align: center;
        }
        select {
            padding: 10px;
            font-size: 1.2em;
            background: #ffffff;
            color: rgb(36, 178, 180);
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        .metrics {
            display: flex;
            justify-content: space-between;
            margin-bottom: 30px;
        }
        .metric-box {
            background: rgba(255, 255, 255, 0.1);
            border-left: 5px solid #ffffff;
            padding: 20px;
            width: 30%;
            border-radius: 5px;
        }
        .metric-box h3 { margin: 0 0 10px 0; color: #f0f0f0; }
        .metric-box h1 { margin: 0; font-size: 2.5em; }
    </style>
</head>
<body>
    <div class="container">
        <div class="controls">
            <label for="fileSelect" style="font-size: 1.2em; margin-right: 10px;">Select Date Record:</label>
            <select id="fileSelect"></select>
        </div>
        <div class="metrics">
            <div class="metric-box">
                <h3>Calculated Score</h3>
                <h1 id="sleepScore">--</h1>
            </div>
            <div class="metric-box">
                <h3>Total Tracked Time</h3>
                <h1 id="totalTime">--</h1>
            </div>
            <div class="metric-box">
                <h3>Current Status</h3>
                <h1 id="currentStatus">Logged</h1>
            </div>
        </div>
        <canvas id="sleepChart" height="100"></canvas>
    </div>

    <script src="app.js"></script>
</body>
</html>
